name: ADMIN Premium White A11 selective release QA

on:
  push:
    branches: [integracion/admin-premium-white-release-a11-20261119]
  pull_request:
    branches: [main]
    paths:
      - 'src/components/admin/**'
      - 'src/app/admin/**'
      - 'src/app/pos/recepciones/**'
      - 'public/updown-admin*'
      - 'public/updown-product*'
      - 'supabase/migrations/20261118202020_admin_sku_collision_safe_allocator.sql'
      - 'tests/admin-*'
      - '.github/workflows/admin-release-a11.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-release-a11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-selective-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: a36_fixture_password
          POSTGRES_DB: upndown_a36_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d upndown_a36_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:4319
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-publishable-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Locked dependencies
        run: npm ci
      - name: Exact selective release contract
        run: node --test tests/admin-release-main.contract.cjs
      - name: SKU allocation on isolated in-memory PostgreSQL
        run: node --test tests/admin-sku-a34.pg.cjs
      - name: SKU collision locking on disposable PostgreSQL service
        env:
          A36_PG_ISOLATED: 'true'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: a36_fixture_password
          PGDATABASE: upndown_a36_fixture
        run: node --test tests/admin-sku-a36-concurrency.pg.cjs
      - name: POS contracts
        run: npm run test:pos
      - name: Legacy runtime syntax
        run: npm run check:admin-scripts
      - name: Lint and types
        run: |
          npm run lint
          npx tsc --noEmit
      - name: Production build with synthetic backend only
        run: npm run build
      - name: Select Chromium executable
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: ADMIN browser regression on synthetic backend
        run: npm run test:admin
