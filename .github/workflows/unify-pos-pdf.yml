name: Unify POS PDF receipt
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unify-pos-pdf.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch PDF receipt
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('src/app/pos/page.tsx')
          s=p.read_text(encoding='utf-8')
          start=s.index('function buildReceiptPdf(')
          end=s.index('\n\nfunction makeDeviceToken', start)
          new=r'''function receiptAmountWords(value: number) {
            const units = ["CERO","UNO","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE","DIEZ","ONCE","DOCE","TRECE","CATORCE","QUINCE","DIECISEIS","DIECISIETE","DIECIOCHO","DIECINUEVE","VEINTE","VEINTIUNO","VEINTIDOS","VEINTITRES","VEINTICUATRO","VEINTICINCO","VEINTISEIS","VEINTISIETE","VEINTIOCHO","VEINTINUEVE"];
            const tens: Record<number,string> = {30:"TREINTA",40:"CUARENTA",50:"CINCUENTA",60:"SESENTA",70:"SETENTA",80:"OCHENTA",90:"NOVENTA"};
            const hundreds: Record<number,string> = {2:"DOSCIENTOS",3:"TRESCIENTOS",4:"CUATROCIENTOS",5:"QUINIENTOS",6:"SEISCIENTOS",7:"SETECIENTOS",8:"OCHOCIENTOS",9:"NOVECIENTOS"};
            const words=(n:number):string=>{ n=Math.floor(n); if(n<30)return units[n]||String(n); if(n<100){const d=Math.floor(n/10)*10,r=n%10;return tens[d]+(r?` Y ${words(r)}`:"");} if(n===100)return "CIEN"; if(n<200)return `CIENTO ${words(n-100)}`; if(n<1000){const h=Math.floor(n/100),r=n%100;return hundreds[h]+(r?` ${words(r)}`:"");} if(n<1000000){const q=Math.floor(n/1000),r=n%1000;return (q===1?"MIL":`${words(q)} MIL`)+(r?` ${words(r)}`:"");} if(n<1000000000){const q=Math.floor(n/1000000),r=n%1000000;return (q===1?"UN MILLON":`${words(q)} MILLONES`)+(r?` ${words(r)}`:"");} return String(n); };
            const whole=Math.floor(value); let cents=Math.round((value-whole)*100); return `${words(whole)} PESOS ${String(cents).padStart(2,"0")}/100 M.N.`;
          }

          function buildReceiptPdf(sale: ShiftSale, access: Access | null) {
            const items = sale.items || [];
            const total = numeric(sale.total);
            const net = Math.round((total / 1.16) * 100) / 100;
            const vat = Math.round((total - net) * 100) / 100;
            const articleCount = items.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
            const estimatedHeight = Math.max(210, 112 + items.length * 15 + (sale.payments || []).length * 7);
            const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: [80, estimatedHeight] });
            const width=80, margin=5, right=75; let y=8;
            const line=(kind="-")=>{doc.setDrawColor(kind==="="?70:155);doc.setLineWidth(kind==="="?0.45:0.2);doc.line(margin,y,right,y);y+=4;};
            const pair=(label:string,value:string,bold=false)=>{doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(bold?9:8);doc.text(label,margin,y);doc.text(value,right,y,{align:"right"});y+=4.2;};
            const centered=(text:string,size=7,bold=false)=>{doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(size);doc.text(text,width/2,y,{align:"center"});y+=size*0.48+1.2;};

            doc.setFont("times","bold"); doc.setFontSize(18); doc.text("UP AND DOWN",width/2,y,{align:"center"}); y+=6;
            centered("PLAZA ALBA - LOCAL 206",7,true); centered("EL TEZAL",7); centered("CABO SAN LUCAS, B.C.S.",7); centered("C.P. 23454",7); centered("upndowncabo.com",7,true); y+=1; line("=");
            doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.text(`VENTA #${sale.sale_number}`,margin,y); y+=4.5;
            doc.setFontSize(8); doc.text("COMPROBANTE DIGITAL",margin,y); y+=4; line();
            doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.text(`Fecha: ${new Date(sale.created_at).toLocaleString("es-MX",{dateStyle:"short",timeStyle:"short"})}`,margin,y);y+=4;
            if(access){doc.text(`Cajero: #${access.employee_number} ${access.full_name}`,margin,y);y+=4;doc.text(`Terminal: ${access.terminal_name || "POS"}`,margin,y);y+=4;} line();

            doc.setFont("helvetica","bold");doc.setFontSize(8);doc.text("CANT",margin,y);doc.text("ARTICULO",15,y);doc.text("IMPORTE",right,y,{align:"right"});y+=4;
            for(const item of items){
              const anyItem=item as typeof item & {category_name?:string|null};
              if(anyItem.category_name){doc.setFont("helvetica","bold");doc.setFontSize(8);doc.text(String(anyItem.category_name).toUpperCase(),margin,y);y+=4;}
              doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.text(String(item.quantity),margin,y);
              const nameLines=doc.splitTextToSize(item.product_name,44);doc.text(nameLines,15,y);doc.setFont("helvetica","bold");doc.text(money(numeric(item.line_total)),right,y,{align:"right"});y+=Math.max(4,nameLines.length*3.3);
              if(Number(item.quantity)>1){doc.setFont("helvetica","normal");doc.setFontSize(6.8);doc.text(`${money(numeric(item.unit_price))} c/u`,15,y);y+=3.4;}
              if(item.sku){doc.setFontSize(6.5);doc.setTextColor(90);doc.text(`SKU: ${item.sku}`,15,y);doc.setTextColor(0);y+=3.4;}
            }
            line(); pair("SUBTOTAL",money(net)); pair("IVA 16%",money(vat)); pair("TOTAL",money(total),true); y+=1;
            doc.setFont("helvetica","bold");doc.setFontSize(7);doc.text("TOTAL CON LETRA:",margin,y);y+=3.5;
            doc.setFont("helvetica","normal");doc.setFontSize(6.7);const wordLines=doc.splitTextToSize(receiptAmountWords(total),70);doc.text(wordLines,margin,y);y+=wordLines.length*3.1+1;
            pair("ARTICULOS COMPRADOS",String(articleCount),true); line();
            doc.setFont("helvetica","bold");doc.setFontSize(8);doc.text("PAGO",margin,y);y+=4;
            for(const payment of sale.payments||[]){pair(paymentLabel(payment.method),money(numeric(payment.amount)));if(payment.reference){doc.setFont("helvetica","normal");doc.setFontSize(7);doc.text(`Ref: ${payment.reference}`,margin,y);y+=3.5;}}
            if(sale.status==="voided"&&sale.void_reason){line();doc.setFont("helvetica","bold");doc.setFontSize(8);doc.text("ANULACION",margin,y);y+=4;doc.setFont("helvetica","normal");doc.text(doc.splitTextToSize(sale.void_reason,68),margin,y);y+=8;}
            if(sale.status==="refunded"&&sale.refund_reason){line();doc.setFont("helvetica","bold");doc.setFontSize(8);doc.text("DEVOLUCION",margin,y);y+=4;doc.setFont("helvetica","normal");doc.text(doc.splitTextToSize(sale.refund_reason,68),margin,y);y+=8;}
            line("="); centered("upndowncabo.com",8,true); centered("Gracias por tu compra.",7); centered("Conserva este comprobante para cualquier aclaracion.",6.5);
            return doc;
          }'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pos/page.tsx
          git commit -m "fix(pos): match PDF receipt to retail thermal ticket"
          git push
