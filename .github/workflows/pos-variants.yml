name: POS variant safety
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/pos-variant-sales-20261103]
permissions:
  contents: read
jobs:
  pos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: pos_variant_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POS_TEST_DATABASE_URL: postgres://postgres:fixture-only-password@127.0.0.1:5432/pos_variant_qa
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:4319
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:pos
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pos:browser
