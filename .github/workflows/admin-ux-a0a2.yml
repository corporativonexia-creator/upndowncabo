name: Admin Premium White A0-A3 candidate QA

on:
  push:
    branches: [integracion/admin-premium-white-a0a2-20261118]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ux-a0a2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: a36_fixture_password
          POSTGRES_DB: upndown_a36_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d upndown_a36_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:4319
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: fixture-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: A0-A3 guard contracts
        run: node --test tests/admin-shell-a1.contract.cjs tests/admin-product-a3.contract.cjs
      - name: A3.4 SKU allocation against isolated PostgreSQL
        run: node --test tests/admin-sku-a34.pg.cjs
      - name: A3.6 SKU locking with independent PostgreSQL transactions
        env:
          A36_PG_ISOLATED: 'true'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: a36_fixture_password
          PGDATABASE: upndown_a36_fixture
        run: node --test tests/admin-sku-a36-concurrency.pg.cjs
      - name: A3.7 proposed UPC gallery atomic append against isolated PostgreSQL
        env:
          A36_PG_ISOLATED: 'true'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: a36_fixture_password
          PGDATABASE: upndown_a36_fixture
        run: node --test tests/admin-gallery-a37-concurrency.pg.cjs
      - name: A5.3 retirement contract against disposable PostgreSQL only
        env:
          A53_PG_ISOLATED: 'true'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: a36_fixture_password
          PGDATABASE: upndown_a36_fixture
        run: node --test tests/admin-retirement-a53.pg.cjs
      - name: Legacy runtime syntax contract
        run: npm run check:admin-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build with mock Supabase only
        run: npm run build
      - name: Select Chromium browser for tests
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Admin UI regression against mock Supabase
        run: npm run test:admin
