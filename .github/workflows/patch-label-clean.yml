name: Clean compact inventory labels

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-label-clean.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Clean label layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/admin/inventory-admin.tsx')
          s=p.read_text(encoding='utf-8')
          start=s.index('function printLabels(r:Row)')
          end=s.index('\n\nexport default function InventoryAdmin()', start)
          new='''function printLabels(r:Row){const code=(r.barcode||"").trim();if(!validEan13(code)){alert("Este SKU necesita un código EAN-13 válido de 13 dígitos antes de imprimir la etiqueta.");return}const suggested=Math.max(1,Number(r.stock)||1),raw=window.prompt("¿Cuántas etiquetas deseas imprimir?",String(suggested));if(raw===null)return;const qty=Math.max(1,Math.min(500,Math.floor(Number(raw)||1))),svg=ean13Svg(code);const labels=Array.from({length:qty},()=>`<section class="label"><div class="brand"><svg class="brand-logo" viewBox="0 0 420 112" xmlns="http://www.w3.org/2000/svg" aria-label="UP AND DOWN"><path d="M70 42 C128 42 150 18 218 18 C278 18 301 46 350 43" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/><path d="M218 18 V2 H252 C241 12 232 15 218 12 Z" fill="black"/><text x="210" y="96" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="42" letter-spacing="13">UP AND DOWN</text></svg></div><div class="name">${esc(r.product_name)}</div>${r.variant_title&&r.variant_title!=="Principal"?`<div class="variant">${esc(r.variant_title)}</div>`:""}<div class="barcode">${svg}</div></section>`).join("");const win=window.open("","_blank","width=700,height=700");if(!win){alert("Permite ventanas emergentes para imprimir etiquetas.");return}win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Etiquetas</title><style>@page{size:50mm 30mm;margin:0}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;font-family:Arial,sans-serif}.label{width:50mm;height:30mm;padding:1mm 2.2mm .8mm;overflow:hidden;page-break-after:always;break-after:page;text-align:center;color:#000}.label:last-child{page-break-after:auto}.brand{height:6.4mm;display:flex;align-items:center;justify-content:center;overflow:hidden}.brand-logo{display:block;width:36mm;height:6.4mm}.name{font-size:8.4pt;font-weight:800;line-height:1.05;margin-top:.15mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.variant{font-size:6pt;font-weight:600;line-height:1;margin-top:.35mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.barcode{height:17mm;margin:.15mm auto 0;display:flex;align-items:center;justify-content:center}.barcode svg{width:44mm;height:17mm;display:block}@media screen{body{background:#eee;padding:10px}.label{background:#fff;margin:0 auto 10px;box-shadow:0 2px 10px #999}}@media print{body{background:#fff}.label{margin:0;box-shadow:none}}</style></head><body>${labels}<script>window.onload=()=>setTimeout(()=>window.print(),250)<\\/script></body></html>`);win.document.close()}'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          if git diff --quiet; then echo "No changes needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/inventory-admin.tsx
          git commit -m "fix(inventory): simplify 50x30 product labels"
          git push
